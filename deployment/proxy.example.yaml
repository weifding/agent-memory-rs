# agent-memory-proxy 本地代理配置
# 复制此文件并修改实际值：cp deployment/proxy.example.yaml deployment/proxy.yaml

# 监听地址（0.0.0.0 允许局域网访问）
listen_host: "0.0.0.0"

# 监听端口
listen_port: 8888

# 远端 MCP 服务器地址（含 /mcp 路径）
target: "http://192.168.25.104:8888/mcp"

# 非本机 IP 访问鉴权 key
# 本机回环（127.0.0.1, ::1）免鉴权
# 其他机器访问需携带 Authorization: Bearer <access_key>
access_key: "change-me"

# 代理→远端服务器鉴权 token（代理自动注入 Authorization 头）
server_auth_token: "change-me-too"

# 写缓冲队列容量（写操作立即返回成功，后台依次转发到后端）
write_queue_size: 1000

# 日志级别
log_level: "INFO"
