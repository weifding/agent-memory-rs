[package]
name = "agent-memory-server"
version = "0.1.0"
edition = "2021"
description = "Framework-agnostic memory system for AI agents, exposed as an MCP server (Rust implementation)"

[features]
default = []
graph = ["kuzu"]

[dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.2", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
kuzu = { version = "0.11", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
rmcp = { path = "vendor/rmcp" }
